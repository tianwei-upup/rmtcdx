plugins { id 'com.android.application' }

// Explicit direct-address builds remain supported. Normal builds ask for the
// unified cloud address rather than silently embedding an old tunnel URL.
def defaultWindowsUrl = providers.gradleProperty('windowsUrl').getOrElse('')
if (defaultWindowsUrl && !(defaultWindowsUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?\/?/)) {
    throw new GradleException('windowsUrl must be an HTTPS service origin')
}

android {
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    namespace 'com.liutw.codexremote'
    compileSdk 34
    defaultConfig {
        applicationId 'com.liutw.codexremote'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.4.2'
        buildConfigField 'String', 'DEFAULT_WINDOWS_URL', groovy.json.JsonOutput.toJson(defaultWindowsUrl)
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets { debug { res.srcDir 'build/localTlsRes' } }
}
