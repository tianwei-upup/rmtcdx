<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Codex</title><link rel="icon" href="/icons/sidebar-simple.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/queue.css"><script type="module" src="/queue-app.js"></script></head>
<body>
<form id="login" class="login-screen" hidden><div class="login-card"><div class="login-mark">C</div><h1>继续你的对话</h1><p>连接电脑上的 Codex。</p><label for="password" class="sr-only">访问密码</label><input class="sr-only" name="username" value="admin" autocomplete="username" tabindex="-1" aria-label="账号"><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><p id="loginNotice" role="alert"></p><button id="loginButton" class="primary-button" type="submit" disabled>连接</button></div></form>
<main id="workspace" class="app queue-chat" hidden>
<header class="topbar"><button id="showChats" class="icon-button" type="button" aria-label="打开会话列表" aria-controls="drawer" aria-expanded="false"><img src="/icons/sidebar-simple.svg" alt=""></button><button id="context" class="context-button" type="button" aria-label="切换会话"><span id="pageTitle" class="chat-title">Codex</span><span id="projectName" class="context-label">正在连接</span></button><span id="connection" class="connection-state" role="status">连接中</span></header>
<div id="notice" class="notice" role="status" hidden><span id="noticeText"></span><button id="dismissNotice" class="icon-button small" type="button" aria-label="关闭提示"><img src="/icons/x.svg" alt=""></button></div>
<section id="chatScroll" class="chat-scroll" aria-label="对话记录" tabindex="-1"><div class="conversation"><div id="empty" class="welcome"><h1>从这段对话继续</h1><p id="emptyHint">发送消息，回答会同步显示在这里。</p></div><p id="historyScope" class="history-scope" hidden>以下是手机接入后的消息与回复</p><section id="queue" role="log" aria-label="消息" aria-live="polite" aria-relevant="additions"></section></div></section>
<button id="jumpBottom" class="icon-button jump-bottom" type="button" aria-label="回到最新消息" hidden><img src="/icons/arrow-down.svg" alt=""></button>
<footer id="composerFooter" class="composer-footer"><div id="recovery" class="review" hidden role="status"><p>上一条消息的发送状态还在确认，内容不会重复提交。</p><button id="reconcile" class="text-button" type="button">核对状态</button><button id="retryPending" class="text-button" type="button" hidden>重试发送</button></div><form id="composer" class="composer"><label id="composerLabel" for="text" class="sr-only">发送消息</label><textarea id="text" rows="1" maxlength="16000" enterkeyhint="enter" placeholder="发送消息"></textarea><div class="composer-actions"><span id="composerContext" class="composer-context">连接中</span><button id="enqueue" class="icon-button send-button" type="submit" aria-label="发送消息" disabled><img src="/icons/arrow-up.svg" alt=""></button><button id="stopReply" class="icon-button send-button" type="button" aria-label="停止回复" hidden><img src="/icons/stop.svg" alt=""></button></div></form><p id="composerHint" class="composer-hint">回答与电脑同步</p></footer>
</main>
<dialog id="drawer" class="drawer" aria-label="会话列表">
<div class="drawer-top"><strong class="drawer-brand">Codex</strong><button id="closeDrawer" class="icon-button" type="button" aria-label="收起会话列表" autofocus><img src="/icons/x.svg" alt=""></button></div>
<div class="project-picker">
<select id="projectSelect" aria-label="选择项目" hidden aria-hidden="true" tabindex="-1"></select>
<button id="projectToggle" class="project-trigger" type="button" aria-expanded="false" aria-controls="projectPanel">
<svg class="project-trigger-icon" aria-hidden="true" focusable="false" viewBox="0 0 256 256" fill="currentColor"><path d="M216,72H130.67L102.93,51.2a16.12,16.12,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V200a16,16,0,0,0,16,16H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72Zm0,128H40V64H93.33L123.2,86.4A8,8,0,0,0,128,88h88Z"/></svg>
<span class="project-trigger-copy"><span id="currentProjectName" class="project-trigger-name">选择项目</span><span id="currentProjectCount" class="project-trigger-meta"></span></span><img class="project-trigger-caret" src="/icons/caret-down.svg" alt="">
</button></div>
<section id="projectPanel" class="project-panel" aria-label="切换项目" hidden>
<label class="search-box project-search"><img src="/icons/magnifying-glass.svg" alt=""><input id="projectSearch" type="search" placeholder="搜索项目" aria-label="搜索项目" autocomplete="off" maxlength="100"></label>
<div class="project-list-heading"><span>选择项目</span><span id="projectMatches" role="status" aria-live="polite"></span></div>
<nav id="projectList" class="project-options" aria-label="项目列表"></nav><p id="noProjects" class="project-empty" hidden>没有找到项目，换个关键词试试</p>
</section>
<label class="search-box chat-search"><img src="/icons/magnifying-glass.svg" alt=""><input id="search" type="search" placeholder="搜索会话" aria-label="搜索会话" autocomplete="off"></label><p id="drawerProject" class="section-label"></p><nav id="chatList" class="session-scroll" aria-label="已有会话"></nav><p id="noChats" class="empty-caption" hidden>没有找到会话</p><div class="drawer-footer"><p id="consumerStatus" class="directory-status" role="status"></p><button id="refresh" class="settings-row" type="button"><img src="/icons/arrow-clockwise.svg" alt="">重新连接</button><button id="stopConsumer" class="settings-row" type="button" hidden><img src="/icons/stop.svg" alt="">暂停手机接收</button><p id="accessPolicy" class="settings-info">电脑需保持开机联网，连接后显示当前权限。</p><p class="settings-info">列表仅显示未归档会话，与桌面保持同步。</p></div>
</dialog>
<!-- Inline icons from @phosphor-icons/core regular; inherit the current theme. -->
<template id="projectOptionTemplate"><button class="project-option" type="button"><span class="project-option-icon" aria-hidden="true"><svg focusable="false" viewBox="0 0 256 256" fill="currentColor"><path d="M216,72H130.67L102.93,51.2a16.12,16.12,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V200a16,16,0,0,0,16,16H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72Zm0,128H40V64H93.33L123.2,86.4A8,8,0,0,0,128,88h88Z"/></svg></span><span class="project-option-copy"><span class="project-option-name"></span><span class="project-option-meta"></span></span><svg class="project-option-check" aria-hidden="true" focusable="false" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg></button></template>
</body></html>
