<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Codex</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<form id="login" hidden class="login-screen"><div class="login-card"><div class="login-mark">C</div><h1>连接你的 Codex</h1><p>登录后，继续电脑上的对话。</p><label for="password" class="sr-only">管理员密码</label><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><p id="loginError" role="alert"></p><button class="primary-button" id="loginSubmit">登录</button></div></form>
<main id="workspace" class="app" hidden>
  <header class="topbar"><button id="showSessions" class="icon-button" aria-label="打开会话列表" aria-controls="drawer"><img src="/icons/sidebar-simple.svg" alt=""></button><button id="context" class="context-button" aria-label="选择项目" aria-controls="drawer"><span class="brand">Codex</span><span id="projectName" class="context-label">正在连接</span></button><div class="topbar-end"><button id="new" class="icon-button" aria-label="新聊天"><img src="/icons/note-pencil.svg" alt=""></button><button id="settingsButton" class="icon-button" aria-label="更多选项"><img src="/icons/dots-three-vertical.svg" alt=""></button></div></header>
  <div id="notice" class="notice" hidden role="status"><span id="status"></span><button id="dismissNotice" class="icon-button small" aria-label="关闭提示"><img src="/icons/x.svg" alt=""></button></div>
  <section id="chatScroll" class="chat-scroll" aria-label="聊天记录" tabindex="-1"><div class="conversation"><div id="welcome" class="welcome"><h1>有什么可以帮忙的？</h1><p>从一个问题开始。</p></div><button id="moreMessages" class="history-button" hidden>加载更早的消息</button><h1 id="title" class="sr-only">新聊天</h1><div id="messages"></div><div id="approvals"></div><div id="pending" class="pending" role="status" hidden><span class="thinking-dot"></span><span id="pendingText"></span></div></div></section>
  <button id="jumpBottom" class="icon-button jump-bottom" aria-label="回到最新消息" hidden><img src="/icons/arrow-down.svg" alt=""></button>
  <footer class="composer-footer"><div id="review" class="review" hidden><p>这次发送的结果尚未确认，请先刷新会话核对。</p><button id="reviewRefresh" class="text-button">刷新会话</button><label><input id="reviewed" type="checkbox">我已核对实际结果</label><button id="resolveUnknown" class="text-button">结束待核对状态</button></div><form id="composer" class="composer"><div id="attachments" class="attachment-list" hidden></div><label for="text" class="sr-only">发送消息</label><textarea id="text" rows="1" maxlength="16000" enterkeyhint="enter" placeholder="发送消息"></textarea><div class="composer-actions"><span id="composerContext" class="composer-context"></span><input id="image" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><button id="attach" type="button" class="icon-button" aria-label="添加图片"><img src="/icons/plus.svg" alt=""></button><button id="send" type="submit" class="icon-button send-button" aria-label="发送消息" disabled><img src="/icons/arrow-up.svg" alt=""></button><button id="interrupt" type="button" class="icon-button send-button" aria-label="停止生成" hidden><img src="/icons/stop.svg" alt=""></button></div></form><p class="composer-hint">Codex 可能会出错，请核对重要信息</p></footer>
</main>
<dialog id="drawer" class="drawer" aria-label="项目与会话"><div class="drawer-top"><label class="search-box"><img src="/icons/magnifying-glass.svg" alt=""><input id="search" type="search" placeholder="搜索项目或最近会话" autocomplete="off" aria-label="搜索项目或最近会话"></label><button id="closeDrawer" class="icon-button" aria-label="收起侧边栏"><img src="/icons/x.svg" alt=""></button></div><div class="directory-actions"><button id="drawerNew" class="drawer-new"><img src="/icons/note-pencil.svg" alt="">新聊天</button><button id="refreshProjects" class="icon-button" aria-label="刷新项目与会话"><img src="/icons/arrow-clockwise.svg" alt=""></button></div><div id="directoryScroll" class="session-scroll"><div id="projectList"></div><p id="projectEmpty" class="empty-caption" hidden>没有找到项目或会话</p></div><div class="drawer-footer"><p id="directoryStatus" class="directory-status" role="status">正在同步目录…</p><button id="toggleArchived" class="settings-row" type="button">显示归档会话</button><select id="project" aria-label="项目" hidden></select><label class="picker-row"><span>电脑</span><select id="device" aria-label="电脑"></select></label><button id="drawerSettings" class="settings-row"><img src="/icons/gear.svg" alt="">设置</button></div></dialog>
<dialog id="settings" class="settings-sheet" aria-labelledby="settingsTitle"><header><h2 id="settingsTitle">设置</h2><button id="closeSettings" class="icon-button" aria-label="关闭设置"><img src="/icons/x.svg" alt=""></button></header><button id="refresh" class="settings-row"><img src="/icons/arrow-clockwise.svg" alt="">刷新当前会话</button><p id="connectionInfo" class="settings-info"></p><p class="settings-info">当前为只读验证环境。电脑需要保持开机联网。</p></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
